[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bedallocation-ml"
version = "0.1.0"
description = "Fresh ML development pipeline for the BedAllocation prototype"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2.3,<4",
  "scikit-learn>=1.5,<2",
  "joblib>=1.4,<2"
]

[project.optional-dependencies]
notebooks = [
  "jupyterlab>=4.2,<5",
  "ipykernel>=6.29,<7",
  "matplotlib>=3.8,<4"
]
xgboost = [
  "xgboost>=2.1,<4"
]
api = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1"
]
test = [
  "httpx>=0.27,<1",
  "httpx2>=2.0.0,<3"
]

[tool.setuptools.packages.find]
where = ["src"]
